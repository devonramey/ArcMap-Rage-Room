name: Physics and weapon regression tests
on:
  push:
    branches: [development-v7-physics, main]
    paths-ignore: ['tests/CI_RESULT.txt', 'tests/CI_OUTPUT.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        id: syntax
        continue-on-error: true
        run: |
          node --check vendor/planck.min.js
          node --check arcmap_physics_v7.js
          node --check tests/physics-smoke.cjs
      - name: Run real Planck simulation tests
        id: physics
        continue-on-error: true
        if: steps.syntax.outcome == 'success'
        run: |
          node tests/physics-smoke.cjs > tests/CI_OUTPUT.txt 2>&1
          code=$?
          cat tests/CI_OUTPUT.txt
          exit "$code"
      - name: Record physics test result in branch
        if: always()
        env:
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          PHYSICS_OUTCOME: ${{ steps.physics.outcome }}
        run: |
          printf 'Commit: %s\nSyntax: %s\nPhysics: %s\n' "$GITHUB_SHA" "$SYNTAX_OUTCOME" "$PHYSICS_OUTCOME" > tests/CI_RESULT.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/CI_RESULT.txt tests/CI_OUTPUT.txt
          git commit -m 'Record physics regression result [skip ci]' || true
          git push origin HEAD:${GITHUB_REF_NAME}
          test "$SYNTAX_OUTCOME" = success && test "$PHYSICS_OUTCOME" = success
